; Open Frame example for an ESP32 + e-paper panel. See README.md.
; Copy include/config.example.h to include/config.h and fill it in first.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  bblanchon/ArduinoJson@^7.0.0

; Classic ESP32 dev board, e.g. with a Waveshare e-Paper HAT / driver board.
[env:esp32]
board = esp32dev

; ESP32-S3 with PSRAM (needed for colour panels: a 24-bit 800×480 picture is ~1.1 MB).
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM
