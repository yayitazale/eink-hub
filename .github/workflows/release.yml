name: Release

# A tag (always created by scripts/release.mjs) publishes :vX.Y.Z and moves
# :latest, so whoever deploys by pulling :latest gets deliberately released
# versions. See docs-site/development/versioning.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/yayitazale/eink-hub
  # Still published for installs that predate the move to GitHub.
  GITLAB_IMAGE: registry.gitlab.com/yayitazale/eink-hub

jobs:
  # Safety net against the classic mistake: creating the tag without bumping
  # the version files, and ending up with a :v0.4.0 image that says 0.3.0
  # inside. If this fails, nothing is published.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          EXPECTED="v$(tr -d ' \r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION (expected $EXPECTED)."
            echo "Always release with: node scripts/release.mjs (see docs-site/development/versioning.md)"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches VERSION."

  test:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      # better-sqlite3 compiles from source when no prebuilt binary matches.
      - run: apt-get update && apt-get install -y --no-install-recommends python3 make g++ fontconfig fonts-inter
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Non-blocking: a new CVE in a dependency is a warning, not a gate.
  npm-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high

  build-image:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A GitLab deploy token with write_registry on yayitazale/eink-hub.
      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/yayitazale/eink-hub
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GITLAB_IMAGE }}:${{ github.ref_name }}
            ${{ env.GITLAB_IMAGE }}:latest

  # Scans the image build-image just published (informational, never blocks).
  trivy-image:
    needs: build-image
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      packages: read
    steps:
      - run: >
          docker run --rm
          -e TRIVY_USERNAME="${{ github.actor }}"
          -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}"
          aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 0
          "$GHCR_IMAGE:$GITHUB_REF_NAME"

  # The project website (docs-site/, VitePress) on GitHub Pages. Every deploy
  # rebuilds the docs of every release from its tag (Pages replaces the whole
  # site), so people on an older version can still read theirs: latest release
  # at the root, older ones under /vX.Y.Z/. Only on tags: unreleased docs
  # describe what no image ships, so they go live with the next release. Needs
  # the full history and tags, also for the "last updated" dates.
  pages:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run build:all
        working-directory: docs-site
        env:
          # https://yayitazale.github.io/eink-hub/
          DOCS_ROOT: /eink-hub/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

  # Records the release in the Releases tab, linking the changelog frozen at
  # that tag. Uploads no assets: what gets published is the image.
  release:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes are this version's section of CHANGELOG.md (written by
      # scripts/release.mjs into the tagged commit), so the release page and
      # the hub's "What's new" link show the changes themselves.
      - uses: actions/checkout@v4
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
