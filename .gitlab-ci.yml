# A release's `git push --follow-tags` pushes two refs at once (the main
# branch and the tag), and GitLab starts one pipeline per ref even though both
# point at the same commit. Runners are ephemeral and don't share a layer
# cache between pipelines, so the image would be built twice for nothing.
#
# The tag pipeline is the one that matters (it checks the version, publishes
# :vX.Y.Z and creates the Release), so the branch one is dropped. It's
# recognised by the commit title, which scripts/release.mjs always writes the
# same way. That commit only touches version files and the changelog, so
# nothing is left unbuilt.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TITLE =~ /^chore\(release\)/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Avoid a duplicate branch pipeline while the same branch has an open MR.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always

stages:
  - scan-deps
  - build
  - scan-image
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

# How the image is tagged depending on what triggered the pipeline. Shared by
# build-image and trivy-image (which must scan exactly the image that was just
# published), hence the anchor.
#
# On a tag, :latest moves to the release. That's the usual convention and
# what makes publishing tags worthwhile: whoever deploys by pulling :latest
# gets deliberately released versions, not every merge to main. main is
# published as :main so it can still be tried out.
.image-rules: &image-rules
  - if: '$CI_COMMIT_TAG'
    variables:
      IMAGE_TAG: "$CI_COMMIT_TAG"
      IMAGE_ALIAS: "latest"
  - if: '$CI_COMMIT_BRANCH == "main"'
    variables:
      IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
      IMAGE_ALIAS: "main"

# Safety net against the classic mistake: creating the tag without bumping
# the version files, and ending up with a :v0.4.0 image that says 0.3.0
# inside. If this fails, nothing should be published.
check-version:
  stage: scan-deps
  image: alpine:3.20
  script:
    - EXPECTED="v$(tr -d ' \r\n' < VERSION)"
    - |
      if [ "$CI_COMMIT_TAG" != "$EXPECTED" ]; then
        echo "Tag $CI_COMMIT_TAG does not match VERSION (expected $EXPECTED)."
        echo "Always release with: node scripts/release.mjs (see docs-site/development/versioning.md)"
        exit 1
      fi
    - echo "$CI_COMMIT_TAG matches VERSION."
  rules:
    - if: '$CI_COMMIT_TAG'

# Blocking: a broken build or a failing test must not reach an image. Runs on
# merge requests too, so contributors get feedback before merging.
test:
  stage: scan-deps
  image: node:22-bookworm-slim
  before_script:
    # better-sqlite3 compiles from source when no prebuilt binary matches.
    - apt-get update && apt-get install -y --no-install-recommends python3 make g++ fontconfig fonts-inter
  script:
    - npm ci
    - npm run build
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# Non-blocking on purpose (allow_failure: true): a new CVE in a dependency
# must not prevent shipping an urgent fix. It's a warning, not a gate.
npm-audit:
  stage: scan-deps
  image: node:22-alpine
  allow_failure: true
  script:
    - npm audit --audit-level=high
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# The project website (docs-site/, VitePress) on GitLab Pages. It must be called
# `pages` and leave the site in `public/`. Every deploy rebuilds the docs of
# every release from its tag (Pages replaces the whole site), so people on an
# older version can still read theirs: latest release at the root, older ones
# under /vX.Y.Z/, main under /main/. Needs the full history and tags.
# Merge requests that touch the docs only build the current version, so broken
# links fail before merging.
# Full image (not slim): git is needed for the tags and "last updated" dates.
.docs: &docs
  stage: build
  image: node:22-bookworm
  variables:
    GIT_DEPTH: 0
    # Shared by every release's `npm ci` in build-all.mjs.
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key: docs-site
    paths: [.npm]
  before_script:
    - cd docs-site
    - npm ci

pages:
  <<: *docs
  script:
    - npm run build:all
  artifacts:
    paths: [public]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'

docs-build:
  <<: *docs
  script:
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [docs-site/**/*, examples/**/*]

build-image:
  stage: build
  image: docker:24.0.6
  services:
    - docker:24.0.6-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >
      docker build
      --pull
      --tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      --tag "$CI_REGISTRY_IMAGE:$IMAGE_ALIAS"
      .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_ALIAS"
  rules: *image-rules

trivy-image:
  stage: scan-image
  # entrypoint: [""] is needed because the trivy image defines its own
  # ENTRYPOINT (["trivy"]) with no shell. Without it, gitlab-runner runs the
  # script as `sh -c "trivy image ..."` but Docker still prepends the image's
  # ENTRYPOINT, so what really runs is `trivy sh -c "..."` -- hence
  # "unknown command sh". Clearing it lets the script run in a normal sh.
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  allow_failure: true
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    # Reuses the image build-image just published, doesn't rebuild.
    - trivy image --severity HIGH,CRITICAL --exit-code 0 "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
  rules: *image-rules

# Records the release in GitLab's Releases tab, linking the changelog frozen
# at that tag. Uploads no artifacts: what gets published is the registry image.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating the Release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: '$CI_COMMIT_TAG'
    description: |
      Image: `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG`

      Changes in this version: [CHANGELOG.md]($CI_PROJECT_URL/-/blob/$CI_COMMIT_TAG/CHANGELOG.md)
  rules:
    - if: '$CI_COMMIT_TAG'
