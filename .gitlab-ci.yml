# The project moved to GitHub (https://github.com/yayitazale/eink-hub), which
# runs CI, publishes the images and the website. This repository is a mirror
# GitHub pushes to (.github/workflows/mirror-gitlab.yml).
#
# The only job left keeps the old website address alive: releases of the app
# up to v0.3.4 link to https://eink-hub-7ba3a3.gitlab.io/, so every path there
# redirects to the same page on GitHub Pages. It runs on tags only, to refresh
# the deployment once per release.
pages:
  image: alpine:3.20
  script:
    - cp -r .gitlab/pages-redirect public
  artifacts:
    paths: [public]
  rules:
    - if: '$CI_COMMIT_TAG'
