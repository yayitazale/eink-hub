services:
  eink-hub:
    # Released image; see docker-compose.override.yml.example to build locally.
    image: ghcr.io/yayitazale/eink-hub:latest
    container_name: eink-hub
    restart: unless-stopped
    # Bridge networking (default). "Search the network" finds BLOOMIN8 frames
    # with a subnet scan of the LAN in LOCAL_URL (.env), or add them by IP.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # Optional mDNS discovery: multicast doesn't cross Docker's bridge, so to
    # also find frames by mDNS use host networking instead (Linux hosts only):
    # uncomment the next line and remove `ports` above.
    # network_mode: host
    volumes:
      - ./data:/data
      # Bluetooth wake (Linux host with BlueZ running): lets the hub use the
      # host's Bluetooth through D-Bus. See docs-site/guide/bluetooth.md.
      # - /run/dbus:/run/dbus:ro
    env_file: .env
