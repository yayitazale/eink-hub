# git-cliff (https://git-cliff.org) configuration that generates CHANGELOG.md
# from commit messages. See docs/versioning.md.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)
and the project uses [Semantic Versioning](https://semver.org/): server and
web share a single number (see `VERSION` at the repository root).

Generated automatically from commit messages. The 0.1.0 entry is the only
one written by hand: it summarises everything before the first release.
"""
# Each new release is prepended to what is already there (--prepend in
# scripts/release.mjs), so this body only describes ONE version.
body = """{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=8, end="") }}](https://gitlab.com/yayitazale/eink-hub/-/commit/{{ commit.id }})){% endfor %}
{% endfor %}"""
trim = false
footer = ""

[git]
conventional_commits = true
# Drops anything that doesn't follow the format -- among other things the
# merge commits GitLab creates when accepting an MR
# ("Merge branch 'x' into 'main'"), which would otherwise clutter every release.
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
  # GitLab issue references (#12) as links.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://gitlab.com/yayitazale/eink-hub/-/issues/${2}))" },
]

# Section order inside each release. The HTML comments only sort the groups
# (git-cliff orders them alphabetically) and are stripped from the output.
commit_parsers = [
  { message = '^Merge branch', skip = true },
  { message = '^chore\(release\)', skip = true },
  { message = '^feat', group = '<!-- 0 -->Added' },
  { message = '^fix', group = '<!-- 1 -->Fixed' },
  { message = '^perf', group = '<!-- 2 -->Performance' },
  { message = '^refactor', group = '<!-- 3 -->Changed' },
  { message = '^docs', group = '<!-- 4 -->Documentation' },
  { message = '^(chore|build|ci|test|style)', group = '<!-- 5 -->Maintenance' },
  { message = '^revert', group = '<!-- 6 -->Reverted' },
]

[bump]
features_always_bump_minor = true
# false on purpose: while the version is 0.x SemVer promises no stability, so
# a breaking change bumps the minor (0.3.0 -> 0.4.0) instead of jumping to
# 1.0.0. 1.0.0 is reserved for the public launch and set by hand:
# `node scripts/release.mjs 1.0.0`.
breaking_always_bump_major = false
